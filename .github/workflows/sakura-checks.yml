name: Chilling Place checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, design/cozy-v7]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check storage.js
          node --check content.js
          node --check wellbeing.js
          node --check cozy-ui.js
          node --check updates.js
      - name: Automated tests
        run: npm test
      - name: Validate app assets
        run: |
          test -s styles.css
          test -s sakura-night.webp
          test -s PRODUCT-COMPARISON.md
          grep -q 'Sakura feature extensions' styles.css
          grep -q 'styles.css?v=7.0.5-home-layout' index.html
      - name: Verify public Pages release
        if: github.ref == 'refs/heads/main'
        run: node scripts/check-published.mjs

